name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Design tokens
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Android and desktop sizes in Chromium: layout, contrast, touch targets.
  visual-chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Device profiles (Android, desktop)
        run: node scripts/visual/run.ts --profiles --only "Android,Desktop" --strict --out visual-out
      - name: Images (fixed boxes, lazy, broken-photo fallback), carousel, illustrations in dark
        run: |
          node scripts/visual/run.ts --images --widths 375,1440 --strict
          node scripts/visual/run.ts --carousel
          node scripts/visual/run.ts --flows
          node scripts/visual/qa-round3.ts --out visual-out/onboarding
          node scripts/visual/run.ts --art --widths 375,1440 --strict --out visual-out/art
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-chromium
          path: visual-out
          if-no-files-found: ignore

  # The four iOS sizes in WebKit (iPhone SE, iPhone 15, iPad 768, iPad Pro 834):
  # layout, contrast, touch targets, no focused input under 16px (iOS zoom),
  # safe-area padding on the bottom tab bar. Non-blocking until it has been green
  # on a few runs; then remove continue-on-error and make it required.
  visual-webkit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps webkit
      - name: Device profiles (iOS sizes, WebKit)
        run: node scripts/visual/run.ts --profiles --only "iPhone SE,iPhone 15,iPad" --strict --out visual-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-webkit
          path: visual-out
          if-no-files-found: ignore
