name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

# A new push to a pull request stops the run for the push before it: only the newest commit's result is
# ever read, and each run costs Actions minutes. Runs on main and staging are never cancelled, because
# every merge there is a deploy and each one needs its own result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    # Every job has a time limit a little over twice what it normally takes, so a hung run cannot spend
    # the month's Actions minutes (they ran out on Nov 10, 2026).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Build output (dist/, dist-e2e/ and the rest) is never committed.
      - name: No build output in git
        run: bash scripts/check-no-build-output.sh && bash scripts/check-no-build-output.selftest.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Every merge to main is a production database deploy: no two migrations with one version,
      # and nothing new that sorts before what main (production) already has.
      - name: Migration versions
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            node scripts/check-migrations.ts "origin/$BASE_REF"
          else
            node scripts/check-migrations.ts
          fi

      - run: npm ci

      - name: Design tokens
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # stubby-scout as it is on this commit against the last deploy that was read back from the live
  # project (supabase/deploys/stubby-scout.json). Vercel ships the app from main on every merge but
  # the function only when someone deploys it; the two drifting apart broke Stubby live (Nov 3,
  # 2026). On main this fails until the deploy is confirmed; on a pull request it only says a
  # deploy will be needed after merging.
  stubby-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stubby deploy confirmed
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            node scripts/check-stubby-deploy.ts
          else
            node scripts/check-stubby-deploy.ts --warn
          fi

  # The smallest iOS size in WebKit (iPhone SE):
  # layout, contrast, touch targets, no focused input under 16px (iOS zoom),
  # safe-area padding on the bottom tab bar. Non-blocking until it has been green
  # on a few runs; then remove continue-on-error and make it required.
  #
  # Cost: with four device sizes this job ran 67 minutes, about 68 of the 78 minutes a CI run used, on every
  # pull request and again on every merge. It now runs only on pushes to main and staging, on the smallest
  # phone (the size that breaks layouts first), with a time limit. The other sizes are still one command:
  #   node scripts/visual/run.ts --profiles --only "iPhone 15,iPad" --strict
  visual-webkit:
    if: github.event_name == 'push'
    # Playwright 1.56 has no browser build for ubuntu-latest (26.04), so pin 24.04.
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps webkit
      - name: Device profiles (iOS sizes, WebKit)
        run: node scripts/visual/run.ts --profiles --only "iPhone SE" --strict --out visual-out
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          # Kept 7 days, not the default 90: these are for looking at a recent run. A refused upload
          # (the Actions storage quota was hit on Nov 10, 2026) does not fail a job whose tests passed.
          retention-days: 7
          name: visual-webkit
          path: visual-out
          if-no-files-found: ignore

  # Guest Stubby, end to end (scripts/e2e/guest-stubby.ts): a production build behind vercel.json's
  # real headers (CSP included), Supabase mocked: 3 asks, the inline card, the limit, Google
  # sign-up (mocked), back in the same chat with the blocked ask sent.
  e2e-guest-stubby:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run e2e:guest
      - name: Interactive landing, normal release flags
        run: npm run e2e:landing -- --record --out landing-e2e-out
      - name: Interactive landing, human onboarding preview
        run: npm run e2e:landing -- --dist dist-e2e --human --out landing-e2e-human-out
      - name: Visible Corner content and editable Pursuit creation
        run: npm run e2e:corner-starters -- --out corner-starters-e2e-out
      - name: Discover resources and Pursuit visibility
        run: npm run e2e:discover-library -- --out discover-library-e2e-out
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          retention-days: 7
          name: e2e-guest-stubby
          path: e2e-guest-stubby-failure.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          retention-days: 7
          name: landing-browser-evidence
          path: |
            landing-e2e-out
            landing-e2e-human-out
            corner-starters-e2e-out
            discover-library-e2e-out
          if-no-files-found: ignore

  # The member gate, checked on a real database (supabase/verification/member_gate_check.sql):
  # every table, view, RPC, bucket and Realtime channel against the allowlist, and the guest,
  # Stubby-account and member cases. Runs only when STAGING_DB_URL is set (a staging project or a
  # Supabase branch, never production). The script always rolls back.
  db-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DB_URL: ${{ secrets.STAGING_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Member gate and guest checks
        run: |
          if [ -z "$DB_URL" ]; then echo "STAGING_DB_URL not set: skipped (the static check in npm test still ran)."; exit 0; fi
          sudo apt-get install -y postgresql-client >/dev/null
          for f in member_gate_check stubby_guests_check; do
            out=$(psql "$DB_URL" -v ON_ERROR_STOP=0 -f "supabase/verification/$f.sql" 2>&1 || true)
            echo "$out" | grep -o "RESULTS:.*" | tr ',' '\n'
            echo "$out" | grep -q "RESULTS:" || { echo "$f: no results"; exit 1; }
            if echo "$out" | grep -o "RESULTS:.*" | grep -qE "FAIL|ERROR|NOT APPLIED"; then echo "$f failed"; exit 1; fi
          done
