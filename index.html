<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Soosh</title>
    <meta name="description" content="Tell Soosh when you’re free and what you want to spend. You get one thing to do that fits. Go on your own or bring a friend." />
    <link rel="canonical" href="https://www.onsoosh.com/" />
    <meta property="og:site_name" content="Soosh" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.onsoosh.com/" />
    <meta property="og:title" content="Soosh" />
    <meta property="og:description" content="Tell Soosh when you’re free and what you want to spend. You get one thing to do that fits." />
    <meta name="twitter:card" content="summary" />
    <script>
      // Only the live site is for search engines. Staging and preview builds
      // share this file, so keep them out of the index.
      if (!/^(www\.)?onsoosh\.com$/.test(location.hostname)) {
        var robots = document.createElement("meta");
        robots.name = "robots";
        robots.content = "noindex, nofollow";
        document.head.appendChild(robots);
      }
    </script>
    <script>
      (function () {
        try {
          // One-time migration from the old "sushii-theme-preference" key
          // (src/app/config.ts's APP_NAME rename) so an existing saved
          // theme survives. Same migration ThemeContext.tsx runs; done here
          // too since this inline script has to read the preference before
          // React (and this file) ever mounts.
          var stored = localStorage.getItem("soosh-theme-preference");
          if (stored === null) {
            var legacy = localStorage.getItem("sushii-theme-preference");
            if (legacy !== null) {
              localStorage.setItem("soosh-theme-preference", legacy);
              stored = legacy;
            }
          }
          var pref = stored === "light" || stored === "dark" || stored === "system" ? stored : "light";
          // Light is the default: dark only when Dark is picked, or System on a dark device.
          var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
